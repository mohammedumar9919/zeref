services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zeref}
      POSTGRES_USER: ${POSTGRES_USER:-zeref}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeref}
    volumes:
      - zeref_postgres_data:/var/lib/postgresql/data

volumes:
  zeref_postgres_data: