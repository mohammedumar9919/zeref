[project]
name = "zeref-whisper"
version = "0.1.0"
description = "Zeref faster-whisper STT sidecar for Jarvis voice (Phase 6)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "faster-whisper>=1.1.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[project.scripts]
zeref-whisper = "whisper_sidecar.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["whisper_sidecar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
