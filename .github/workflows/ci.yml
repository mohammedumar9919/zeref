name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase0:
    name: Phase 0–9 gate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zeref
          POSTGRES_USER: zeref
          POSTGRES_PASSWORD: zeref
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeref -d zeref"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint / Typecheck
        run: npm run lint

      - name: Verify Phase 0
        run: npm run verify:phase-0

      - name: Verify Phase 1
        run: npm run verify:phase-1
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 2
        run: npm run verify:phase-2
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 3
        run: npm run verify:phase-3
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 4
        run: npm run verify:phase-4
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref
          ZEREF_LLM_MOCK: "1"

      - name: Install Playwright Chromium
        run: npm -w @zeref/web run test:e2e:install

      - name: Verify Phase 5
        run: npm run verify:phase-5
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"

      - name: Verify Phase 5.1
        run: npm run verify:phase-5.1
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"

      - name: Verify Phase 6.1
        run: npm run verify:phase-6.1
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE61_UI: "1"

      - name: Verify Phase 6
        run: npm run verify:phase-6
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"

      - name: Verify Phase 7
        run: npm run verify:phase-7
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"

      - name: Verify Phase 8
        run: npm run verify:phase-8
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"

      - name: Verify Phase 9
        run: npm run verify:phase-9
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"

      - name: Verify P8 hotfix (Studio/Reports hubs)
        run: npm run verify:hotfix-p8
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"

      - name: Verify Phase 10
        run: npm run verify:phase-10
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_PHASE10_OPS: "1"

