name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase0:
    name: Phase 0–3 gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zeref
          POSTGRES_USER: zeref
          POSTGRES_PASSWORD: zeref
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeref -d zeref"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint / Typecheck
        run: npm run lint

      - name: Verify Phase 0
        run: npm run verify:phase-0

      - name: Verify Phase 1
        run: npm run verify:phase-1
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 2
        run: npm run verify:phase-2
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 3
        run: npm run verify:phase-3
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

