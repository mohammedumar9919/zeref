name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  phase0:
    name: Phase 0 gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint / Typecheck
        run: npm run lint

      - name: Verify Phase 0
        run: npm run verify:phase-0

