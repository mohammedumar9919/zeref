name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Verify scripts chain into earlier phases (12 → 11 → 10.5 → 10 → 9/hotfix-p8 → 8 → 7 → 6 → 5.1 → 0–5).
# Jobs below run each script once with ZEREF_SKIP_PRIOR_CHAIN=1 and its own env, in parallel;
# `chain-p8` keeps one unskipped deep chain (8 → 7 → 6 → 5.1 → 0–5) so the nested full
# Playwright pass under Phase 6/7/8 flags is still exercised. See docs/cloud/phases/C20a-ci-split.md.

jobs:
  db-phases:
    name: Build, lint, Phases 0–4 (DB)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: zeref
          POSTGRES_USER: zeref
          POSTGRES_PASSWORD: zeref
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zeref -d zeref"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Lint / Typecheck
        run: npm run lint

      - name: Verify Phase 0
        run: npm run verify:phase-0

      - name: Verify Phase 1
        run: npm run verify:phase-1
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 2
        run: npm run verify:phase-2
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 3
        run: npm run verify:phase-3
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref

      - name: Verify Phase 4
        run: npm run verify:phase-4
        env:
          DATABASE_URL: postgres://zeref:zeref@localhost:5432/zeref
          ZEREF_LLM_MOCK: "1"

  ui-a:
    name: Phases 5, 5.1, 6.1, 6.2, 6 (UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm -w @zeref/web run test:e2e:install

      - name: Verify Phase 5
        run: npm run verify:phase-5
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"

      - name: Verify Phase 5.1
        run: npm run verify:phase-5.1
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 6.1
        run: npm run verify:phase-6.1
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE61_UI: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 6.2
        run: npm run verify:phase-6.2
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE61_UI: "1"
          ZEREF_PHASE62_UI: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 6
        run: npm run verify:phase-6
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

  chain-p8:
    name: Phase 8 (full prior chain 0–7)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm -w @zeref/web run test:e2e:install

      # Intentionally no ZEREF_SKIP_PRIOR_CHAIN: keeps the nested 7 → 6 → 5.1 → 0–5 chain.
      - name: Verify Phase 8
        run: npm run verify:phase-8
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"

  ui-b:
    name: Phases 7, 9, hotfix-p8 (UI)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm -w @zeref/web run test:e2e:install

      - name: Verify Phase 7
        run: npm run verify:phase-7
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 9
        run: npm run verify:phase-9
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify P8 hotfix (Studio/Reports hubs)
        run: npm run verify:hotfix-p8
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

  ops-agent:
    name: Phases 10, 10.5, 11, 12 (ops/agent/data)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npm -w @zeref/web run test:e2e:install

      - name: Verify Phase 10
        run: npm run verify:phase-10
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_PHASE10_OPS: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 10.5
        run: npm run verify:phase-10.5
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_PHASE10_OPS: "1"
          ZEREF_PHASE105_STABILITY: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 11
        run: npm run verify:phase-11
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_PHASE10_OPS: "1"
          ZEREF_PHASE105_STABILITY: "1"
          ZEREF_PHASE11_AGENT: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

      - name: Verify Phase 12
        run: npm run verify:phase-12
        env:
          ZEREF_LLM_MOCK: "1"
          ZEREF_TTS_MOCK: "1"
          ZEREF_WHISPER_MOCK: "1"
          ZEREF_BFF_FIXTURE: "1"
          ZEREF_PHASE51_UI: "1"
          ZEREF_PHASE6_VOICE: "1"
          ZEREF_MEMORY_MOCK: "1"
          ZEREF_PHASE7_BRAIN: "1"
          ZEREF_PHASE8_PRODUCT: "1"
          ZEREF_JOB_ENQUEUE_MOCK: "1"
          ZEREF_PHASE9_RESEARCH: "1"
          ZEREF_PHASE10_OPS: "1"
          ZEREF_PHASE105_STABILITY: "1"
          ZEREF_PHASE11_AGENT: "1"
          ZEREF_PHASE12_DATA: "1"
          ZEREF_SKIP_PRIOR_CHAIN: "1"

  # Aggregate check: branch protection and tooling look for this exact name.
  phase0:
    name: Phase 0–9 gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [db-phases, ui-a, chain-p8, ui-b, ops-agent]
    if: always()

    steps:
      - name: All phase jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: |
          echo "$RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "One or more phase jobs did not succeed."
            exit 1
          fi
